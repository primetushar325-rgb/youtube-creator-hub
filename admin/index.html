<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Creator Hub — Admin</title>
<meta name="theme-color" content="#0f0f10" />
<link rel="stylesheet" href="/admin/admin.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
<div id="adminApp">
  <!-- Login screen -->
  <div id="loginView" class="login" style="display:none">
    <div class="login-card">
      <h1>Creator Hub Admin</h1>
      <p class="muted">Sign in to view analytics &amp; manage the hub.</p>
      <input id="loginUser" placeholder="Username" autocomplete="username" />
      <input id="loginPass" type="password" placeholder="Password" autocomplete="current-password" />
      <button id="loginBtn" class="btn">Sign In</button>
      <div id="loginErr" class="err" hidden></div>
    </div>
  </div>

  <!-- Dashboard -->
  <div id="dashView" style="display:none">
    <header class="topbar">
      <div class="brand">Creator Hub <span>Admin</span></div>
      <button id="logoutBtn" class="btn ghost">Logout</button>
    </header>

    <main class="wrap">
      <div class="grid stats" id="statCards"></div>

      <div class="two-col">
        <section class="card">
          <h2>Most Used Tools</h2>
          <div id="topTools"></div>
        </section>
        <section class="card">
          <h2>Visits (last 14 days)</h2>
          <div id="recentDays"></div>
        </section>
      </div>

      <section class="card">
        <h2>Tracked Channels</h2>
        <div class="add-row">
          <input id="chanInput" placeholder="Add channel name…">
          <button id="chanAdd" class="btn">Add</button>
        </div>
        <div id="chanList"></div>
      </section>

      <section class="card">
        <h2>Saved Trends / Watchlist</h2>
        <div id="trendList"></div>
      </section>

      <section class="card">
        <h2>🔔 Notification Center</h2>
        <div class="notif-composer">
          <input id="notifTitle" placeholder="Notification title" />
          <textarea id="notifMsg" placeholder="Notification message" rows="2"></textarea>
          <div class="notif-row">
            <input id="notifUrl" placeholder="URL (e.g. /#/tools)" value="/" />
            <select id="notifTarget">
              <option value="all">All Users</option>
              <option value="installed">Installed App Users</option>
              <option value="subscribed">Subscribed to notifications</option>
            </select>
          </div>
          <div class="notif-row">
            <input id="notifIcon" placeholder="Icon URL (optional)" />
            <input id="notifImage" placeholder="Image URL (optional)" />
          </div>
          <div class="notif-row">
            <input type="datetime-local" id="notifSchedule" />
            <button class="btn" id="notifSend">Send Notification</button>
            <button class="btn ghost" id="notifNow">Send Now</button>
          </div>
          <div id="notifResult" class="err" hidden></div>
        </div>
        <h3 style="margin:18px 0 8px">History</h3>
        <div id="notifHistory"></div>
      </section>

      <section class="card">
        <h2>🔔 Notification Settings</h2>
        <div id="notifSettings"></div>
      </section>
    </main>
  </div>
</div>
<script src="/admin/admin.js"></script>
</body>
</html>
