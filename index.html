<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>YouTube Creator Hub</title>
<meta name="description" content="48 AI tools for YouTube creators: titles, scripts, TTS, STT, thumbnails, SEO, calculators and more." />
<meta name="theme-color" content="#0f0f10" />
<style>
  :root{--bg:#ffffff;--fg:#111;--muted:#666;--line:#ececec;--yellow:#ffd60a;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .wrap{max-width:680px;width:100%;text-align:center}
  .brand{font-weight:800;letter-spacing:.5px;font-size:14px;color:var(--muted);text-transform:uppercase;margin-bottom:18px}
  h1{font-size:clamp(28px,5vw,44px);font-weight:800;line-height:1.15;margin-bottom:14px}
  p.lead{color:var(--muted);font-size:16px;max-width:560px;margin:0 auto 28px;line-height:1.6}
  .hub-btn{display:inline-block;padding:16px 30px;border-radius:14px;background:#111;color:#fff;text-decoration:none;font-weight:700;font-size:16px;border:2px solid var(--yellow);box-shadow:0 0 30px rgba(255,214,10,.4);transition:transform .2s}
  .hub-btn:hover{transform:translateY(-2px)}
  .note{margin-top:26px;color:var(--muted);font-size:13px}
  .pill{display:inline-block;margin-bottom:14px;padding:6px 14px;border-radius:999px;background:var(--yellow);color:#111;font-weight:700;font-size:13px}
</style>
</head>
<body>
  <main class="wrap">
    <div class="brand">YouTube Creator Hub</div>
    <span class="pill">48 AI Tools · Mobile-first</span>
    <h1>Everything you need to grow on YouTube.</h1>
    <p class="lead">Generate titles, scripts, voiceovers, thumbnails, captions, SEO and more — each tool purpose-built for the job.</p>
    <a class="hub-btn" href="./youtube-hub/index.html">Open Creator Hub &rarr;</a>
    <p class="note">Black · White · Yellow · Fast · Free</p>
  </main>
</body>
</html>
